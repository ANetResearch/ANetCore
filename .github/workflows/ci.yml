name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"   # K207 A3: the distributed runtime is pure Go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: tests
        run: go test ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tests under the race detector
        env:
          CGO_ENABLED: "1"   # -race needs cgo; runners ship gcc
        run: go test -race ./...

  # The golden vectors, regenerated by an implementation that shares nothing with the Go code
  # (golden/py/gen_v016.py: Python on the cryptography package) and compared byte for byte with
  # the files in the repository. golden/index_test.go, in the jobs above, checks the index.
  golden-xcheck:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the independent implementation's library
        run: "python -m pip install --only-binary=:all: -r golden/py/requirements.txt"
      - name: self-tests of the generator
        run: python golden/py/test_gen_v016.py
      - name: regenerate every vector and compare
        run: python golden/py/gen_v016.py check
